[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-de-editais"
version = "0.1.0"
description = "Preparação auditável de editais PNCP para RAG"
requires-python = ">=3.12"
dependencies = [
  "fonttools>=4.60,<5",
  "langchain-core>=1,<2", "langchain-text-splitters>=1,<2",
  "langchain-groq>=1,<2", "fastembed>=0.7,<1", "pypdf>=6,<7",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pip-audit>=2,<3"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
